<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800" height="1130">
  <defs>
    <clipPath id="outer-stand-clip">
      <rect x="0" y="0" width="800" height="1130" rx="32" ry="32" />
    </clipPath>
    <filter id="stand-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Google 4-Color Signature Corners (Model L-Stand Meja Kasir Otentik) -->
  <g clip-path="url(#outer-stand-clip)">
    <!-- Top Left: Blue -->
    <rect x="0" y="0" width="384" height="542.4" fill="#4285F4" />
    <!-- Top Right: Red -->
    <rect x="384" y="0" width="416" height="452" fill="#EA4335" />
    <!-- Bottom Right: Yellow -->
    <rect x="384" y="452" width="416" height="678" fill="#FBBC05" />
    <!-- Bottom Left: Green -->
    <rect x="0" y="542.4" width="384" height="587.6" fill="#34A853" />
  </g>

  <!-- Kartu Tengah Putih Bersih dengan Sudut Membulat -->
  <rect x="36" y="48" width="728" height="1034" rx="28" ry="28" fill="#FFFFFF" filter="url(#stand-shadow)" />

  <!-- Tab Bulat Logo Google di Bagian Atas Kartu -->
  <circle cx="400" cy="76" r="58" fill="#FFFFFF" />

  <!-- Logo Google G Resmi -->
  <g transform="translate(360, 36)">
    
    <g transform="scale(1.7)">
      <path d="M44.5 20 H24 V28.5 H35.8 C34.7 34.2 29.8 37.5 24 37.5 C16.5 37.5 10.5 31.5 10.5 24 C10.5 16.5 16.5 10.5 24 10.5 C27.3 10.5 30.2 11.7 32.5 13.8 L38.8 7.5 C34.9 3.8 29.8 1.5 24 1.5 C11.6 1.5 1.5 11.6 1.5 24 C1.5 36.4 11.6 46.5 24 46.5 C36.4 46.5 45 37.5 45 24 C45 22.6 44.8 21.3 44.5 20 Z" fill="#4285F4"/>
      <path d="M6.3 14.7 L13.3 19.8 C15.2 14.3 20.3 10.5 24 10.5 C27.3 10.5 30.2 11.7 32.5 13.8 L38.8 7.5 C34.9 3.8 29.8 1.5 24 1.5 C16.4 1.5 9.8 5.7 6.3 14.7 Z" fill="#34A853"/>
      <path d="M24 46.5 C29.8 46.5 34.8 44.4 38.6 40.8 L31.8 35.2 C29.8 36.6 27.1 37.5 24 37.5 C18.3 37.5 13.4 34.2 11.6 29.2 L4.6 34.6 C8.1 41.6 15.5 46.5 24 46.5 Z" fill="#FBBC05"/>
      <path d="M4.6 13.4 C3.6 16.6 3 20.2 3 24 C3 27.8 3.6 31.4 4.6 34.6 L11.6 29.2 C11.1 27.6 10.5 25.8 10.5 24 C10.5 22.2 11.1 20.4 11.6 18.8 L4.6 13.4 Z" fill="#EA4335"/>
    </g>
  
  </g>

  <!-- Headline: review us on Google (Identik Foto Fisik Meja Kasir) -->
  <text x="400" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', Roboto, sans-serif" font-size="28" font-weight="500" fill="#202124" letter-spacing="-0.3">
    review us
  </text>
  <text x="400" y="236" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', Roboto, sans-serif" font-size="56" font-weight="800" fill="#202124" letter-spacing="-1.2">
    on Google
  </text>

  <!-- Garis Pembagi Vertikal Antara NFC dan QR -->
  <line x1="400" y1="520" x2="400" y2="730" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round" />

  <!-- Badge 'OR' di Tengah Garis -->
  <rect x="380" y="610" width="40" height="26" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" />
  <text x="400" y="628" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#6B7280">
    OR
  </text>

  <!-- KOLOM KIRI: TAP YOUR PHONE -->
  <g transform="translate(216, 560)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#202124" letter-spacing="0.5">
      TAP YOUR PHONE
    </text>

    <!-- Ikon Otentik: Gelombang NFC dalam Elips + Smartphone dipegang Tangan -->
    <g transform="translate(-74, 25)">
      <!-- Elips Gelombang NFC -->
      <ellipse cx="40" cy="54" rx="30" ry="38" fill="none" stroke="#202124" stroke-width="2.8" />
      <path d="M 32 36 A 22 22 0 0 1 32 72" fill="none" stroke="#202124" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 42 43 A 14 14 0 0 1 42 65" fill="none" stroke="#202124" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 52 50 A 6 6 0 0 1 52 58" fill="none" stroke="#202124" stroke-width="3.5" stroke-linecap="round" />

      <!-- Smartphone -->
      <rect x="80" y="24" width="34" height="66" rx="6" fill="#ffffff" stroke="#202124" stroke-width="2.8" />
      <line x1="91" y1="29" x2="103" y2="29" stroke="#202124" stroke-width="1.8" stroke-linecap="round" />
      <text x="97" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#202124" letter-spacing="0.3">
        NFC
      </text>

      <!-- Tangan memegang smartphone -->
      <path d="M 72 53 C 75 53 80 56 80 62 C 80 67 76 68 73 68 C 70 68 67 63 67 58 C 67 55 69 53 72 53 Z" fill="#ffffff" stroke="#202124" stroke-width="2.8" stroke-linejoin="round" />
      <path d="M 114 59 C 120 59 123 64 123 68 C 123 73 118 74 114 74" fill="none" stroke="#202124" stroke-width="2.8" stroke-linecap="round" />
      <path d="M 114 74 C 119 74 122 78 122 82 C 122 86 117 87 114 87" fill="none" stroke="#202124" stroke-width="2.8" stroke-linecap="round" />
    </g>

    <text x="0" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#64748B">
      Tempelkan ke sini
    </text>
  </g>

  <!-- KOLOM KANAN: SCAN QR -->
  <g transform="translate(584, 560)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#202124" letter-spacing="0.5">
      SCAN QR
    </text>

    <!-- Kartu QR Barcode -->
    <rect x="-100" y="16" width="200" height="200" rx="14" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2" />
    <g transform="translate(-88, 28) scale(5.333333333333333)">
      <path d="M0 0.5h7m1 0h1m2 0h1m4 0h2m1 0h2m1 0h1m1 0h1m1 0h7M0 1.5h1m5 0h1m4 0h1m1 0h4m2 0h1m2 0h1m1 0h1m1 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m1 0h5m2 0h2m4 0h4m1 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m6 0h3m4 0h2m1 0h2m1 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h3m1 0h2m2 0h1m1 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m4 0h1m1 0h1m3 0h1m1 0h2m1 0h1m1 0h1m1 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M8 7.5h8m1 0h1m1 0h1m2 0h1m1 0h1M5 8.5h2m2 0h2m1 0h1m1 0h4m1 0h1m1 0h2m3 0h1m1 0h1m1 0h1m1 0h1M1 9.5h1m1 0h3m2 0h2m1 0h3m3 0h1m2 0h3m2 0h1m1 0h2m1 0h1M1 10.5h4m1 0h1m2 0h2m2 0h2m1 0h2m4 0h1m4 0h1m1 0h1m1 0h1M2 11.5h3m10 0h2m2 0h3m1 0h1m1 0h3m1 0h3M0 12.5h2m4 0h1m2 0h2m2 0h4m1 0h1m2 0h1m2 0h1m1 0h4m2 0h1M0 13.5h2m1 0h1m1 0h1m3 0h3m3 0h2m1 0h1m2 0h1m1 0h1m2 0h1m2 0h1m2 0h1M0 14.5h4m1 0h2m1 0h1m5 0h1m3 0h2m2 0h1m2 0h3m1 0h3M1 15.5h1m2 0h2m3 0h1m1 0h2m2 0h4m5 0h2m4 0h2M0 16.5h1m1 0h1m2 0h2m2 0h2m1 0h1m1 0h2m1 0h1m1 0h2m4 0h1m1 0h4m1 0h1M2 17.5h1m1 0h1m3 0h1m2 0h4m3 0h1m1 0h2m1 0h4m5 0h1M0 18.5h2m2 0h5m1 0h1m3 0h2m2 0h1m2 0h3m1 0h2m1 0h5M2 19.5h1m5 0h2m2 0h3m1 0h3m3 0h3m2 0h6M0 20.5h1m1 0h3m1 0h3m1 0h1m1 0h1m2 0h2m1 0h2m4 0h1m3 0h2m2 0h1M0 21.5h1m1 0h1m2 0h1m3 0h2m3 0h2m1 0h1m1 0h1m1 0h2m3 0h4M0 22.5h1m1 0h2m2 0h2m2 0h1m1 0h1m2 0h2m1 0h2m1 0h2m1 0h1m5 0h2M0 23.5h1m4 0h1m1 0h1m4 0h1m6 0h1m4 0h1m4 0h2m1 0h1M0 24.5h3m2 0h2m1 0h1m3 0h1m1 0h1m3 0h4m1 0h7M8 25.5h1m2 0h4m1 0h1m2 0h2m3 0h1m3 0h2m1 0h2M0 26.5h7m2 0h1m4 0h2m1 0h1m3 0h1m1 0h2m1 0h1m1 0h2m1 0h1M0 27.5h1m5 0h1m1 0h4m1 0h2m1 0h1m1 0h3m3 0h1m3 0h4M0 28.5h1m1 0h3m1 0h1m2 0h2m5 0h1m2 0h1m1 0h1m2 0h5m2 0h2M0 29.5h1m1 0h3m1 0h1m2 0h2m1 0h1m1 0h1m1 0h1m1 0h1m2 0h2m2 0h1m1 0h2m1 0h2M0 30.5h1m1 0h3m1 0h1m3 0h1m3 0h4m1 0h1m3 0h2m3 0h5M0 31.5h1m5 0h1m2 0h1m6 0h3m3 0h1m3 0h1m3 0h1M0 32.5h7m2 0h1m2 0h1m1 0h3m2 0h2m1 0h5m2 0h3" stroke="#000000" stroke-width="1" fill="none" shape-rendering="crispEdges" />
    </g>

    <!-- Kode Seri Plate -->
    <text x="0" y="242" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, monospace, sans-serif" font-size="17" font-weight="700" fill="#1F2937" letter-spacing="1.2">
      ULK-000001
    </text>
  </g>

  <!-- Bagian Bawah: Nama Bisnis & Footer Powered by -->
  <g transform="translate(400, 1018)">
    <text x="0" y="-12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', sans-serif" font-size="20" font-weight="700" fill="#111827">Kopi Kenangan Senopati (Demo)</text>
    <text x="0" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#4B5563">
      powered by <tspan fill="#1A73E8" font-weight="800">ulaskami.com</tspan>
    </text>
  </g>

  <!-- Label Teknis Model di Margin Bawah -->
  <g transform="translate(400, 1118)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#94A3B8" letter-spacing="1">
      MODEL STAND MEJA KASIR (L-STAND A6 &bull; 10.5 &times; 14.8 CM)
    </text>
  </g>

  
    <g stroke="#94a3b8" stroke-width="1.2">
      <line x1="0" y1="30" x2="30" y2="30" />
      <line x1="30" y1="0" x2="30" y2="30" />
      <line x1="770" y1="0" x2="770" y2="30" />
      <line x1="770" y1="30" x2="800" y2="30" />
      <line x1="0" y1="1100" x2="30" y2="1100" />
      <line x1="30" y1="1100" x2="30" y2="1130" />
      <line x1="770" y1="1100" x2="800" y2="1100" />
      <line x1="770" y1="1100" x2="770" y2="1130" />
    </g>
  
</svg>